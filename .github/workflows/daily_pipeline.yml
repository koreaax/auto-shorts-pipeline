name: Daily Automated Content Pipeline

on:
  schedule:
    # 매일 아침 08:00 KST (23:00 UTC)에 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 필요 시 버튼 눌러 수동 즉시 실행 지원

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gTTS pillow

      - name: Run Auto Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
        run: |
          python pipeline/main.py

      - name: Upload Artifacts (Generated Shorts Frame & Audio)
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-content
          path: |
            pipeline_audio.mp3
            pipeline_frame.png
