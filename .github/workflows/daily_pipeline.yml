name: Daily Automated Content Pipeline

on:
  schedule:
    # 매일 아침 08:00 KST (23:00 UTC)에 자동 실행
    #- cron: '0 23 * * *'
    # 1회차: 한국시간 11:30 (점심시간 피드 진입)
    - cron: '30 2 * * *'
    # 2회차: 한국시간 17:30 (퇴근길 피드 진입)
    #- cron: '30 8 * * *'
    # 3회차: 한국시간 22:00 (취침 전 골든타임)
    #- cron: '0 13 * * *'

  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome & ChromeDriver (티스토리 Selenium용)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-nanum
          pip install webdriver-manager
          fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts gTTS pillow moviepy requests selenium webdriver-manager

      - name: Run Auto Pipeline v2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TISTORY_KAKAO_EMAIL: ${{ secrets.TISTORY_KAKAO_EMAIL }}
          TISTORY_KAKAO_PASSWORD: ${{ secrets.TISTORY_KAKAO_PASSWORD }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
          COUPANG_AFFILIATE_LINK: ${{ secrets.COUPANG_AFFILIATE_LINK }}
        run: |
          python pipeline/main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-content
          path: |
            pipeline_audio.mp3
            pipeline_frame.png
            pipeline_output.mp4
